appId: com.reasoningtutor.app
androidWebViewHierarchy: devtools
---
- tapOn: 'current-step-option-FRACTION'
- tapOn: 'Continue'
- tapOn: 'current-step-option-WHOLE'
- tapOn: 'Continue'
- tapOn: 'current-step-option-UNKNOWN'
- scrollUntilVisible:
    element:
      text: 'final-answer-input'
    direction: DOWN
- tapOn: 'final-answer-input'
- inputText: '20'
- hideKeyboard
- tapOn: 'Submit answer'
- assertVisible: 'Session complete.'
